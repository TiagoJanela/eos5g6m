Status: In progress
Title: GLACIER Molecular Embeddings
Description: GLACIER is a multimodal student-teacher foundation model that turns
  a SMILES string into a 512-dimensional molecular embedding. It internally 
  fuses three views of a molecule — a message-passing graph encoder, a SMILES 
  transformer, and physicochemical descriptors — through a geometry-aware 
  module, distilled from larger teacher models via contrastive learning. The 
  embedding is a general-purpose featurizer for downstream molecular property 
  prediction.
