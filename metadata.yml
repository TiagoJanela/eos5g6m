Title: GLACIER Molecular Embeddings
Description: GLACIER encodes molecules into 512 features using a student-teacher arrangement
  in which a lightweight student learns to reproduce representations from larger multimodal
  teachers. Nguyen and colleagues designed it so that the expressive power of heavy
  foundation models becomes available at a fraction of the inference cost, with the
  student trained to match teacher embeddings rather than to predict properties. The
  embedding is task-independent, and its dimensions carry no interpretable chemical
  meaning individually.
